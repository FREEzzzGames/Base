services:
  - type: web
    name: freezzz-telegram-auth
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://freezzgames.github.io
      - key: TELEGRAM_REQUIRED_CHAT_ID
        sync: false
      - key: TELEGRAM_REQUIRE_MEMBERSHIP
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_DATA_API_KEY
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: LIVE_REFRESH_SECRET
        sync: false
      - key: LIVE_REFRESH_HOUR_UTC
        value: "4"
      - key: LIVE_DATA_PATH
        value: /tmp/freezzz-live-data.json
