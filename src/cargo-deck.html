<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>FREEzzz GAMES — CARGO DECK</title>
</head>
<body>
<main class="console" aria-label="CARGO DECK retro console">
<header class="brand"><div class="brand-name"><span class="power-mark"></span> FREEzzz GAMES</div><div class="model">MODEL 1984 · PORTABLE</div><div class="stripe"><i></i><i></i><i></i><i></i></div></header>
<section class="screen-shell" aria-label="Game display"><div id="cargo-game"></div></section>
<div class="screen-caption"><span>CARGO DECK</span><span>TACTICAL COMBAT · WAVES</span></div>
<section class="control-deck" aria-label="Game controls">
<div class="movement-column"><div class="move-label">MOVE / 360°</div><div class="move-pad" aria-label="360 degree movement control"><span class="move-ring"></span><span class="move-thumb"></span><i class="arrow a-up"></i><i class="arrow a-right"></i><i class="arrow a-down"></i><i class="arrow a-left"></i></div><div class="sensor-label">DIRECTION SENSOR</div></div>
<div class="actions">
<button class="key" data-action="weapon" aria-label="Weapon selection"><b>W</b><small>WEAPON</small></button>
<button class="key amber" data-action="reload" aria-label="Reload weapon"><b>R</b><small>RELOAD</small></button>
<button class="key blue" data-action="auto" aria-label="Toggle auto fire"><b>A</b><small>AUTO</small></button>
<button class="key blue" data-action="grenade" aria-label="Throw grenade"><b>G</b><small>GRENADE</small></button>
<button class="key attack" data-action="attack" aria-label="Hold to fire"><b>⚔</b><small>ATTACK</small></button>
<button class="key blue" data-action="medkit" aria-label="Use medkit"><b>+</b><small>MEDKIT</small></button>
<button class="key green" data-action="ability" aria-label="Special ability"><b>✦</b><small>SPECIAL</small></button>
<button class="key amber" data-action="menu" aria-label="Menu"><b>⌂</b><small>MENU</small></button>
</div>
</section>
<footer class="console-footer"><span>CRT · 8-BIT ACTION SYSTEM</span><button data-action="reset">START / RESET ↻</button></footer>
</main>
<script type="module" src="./cargo-deck-entry.ts"></script>
</body>
</html>
