name: package-deepseek-context
on:
  push:
    paths:
      - "DEEPSEEK_CARGO_DECK_FULL.md"
      - ".github/workflows/package-deepseek-context.yml"
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package full MD
        run: zip -j DEEPSEEK_CARGO_DECK_FULL.zip DEEPSEEK_CARGO_DECK_FULL.md
      - uses: actions/upload-artifact@v4
        with:
          name: DEEPSEEK_CARGO_DECK_FULL
          path: DEEPSEEK_CARGO_DECK_FULL.zip
