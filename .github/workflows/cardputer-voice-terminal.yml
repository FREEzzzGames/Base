name: FREEzzz Cardputer Voice Terminal

on:
  push:
    branches: [main]
    paths:
      - "hardware/cardputer-voice-terminal/**"
      - ".github/workflows/cardputer-voice-terminal.yml"
  pull_request:
    paths:
      - "hardware/cardputer-voice-terminal/**"
      - ".github/workflows/cardputer-voice-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/cardputer-voice-terminal/server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: bash -n install-hub.sh

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Prepare temporary verified WSS configuration
        run: |
          curl -fsSL https://letsencrypt.org/certs/isrgrootx1.pem -o hardware/cardputer-voice-terminal/firmware/src/isrgrootx1.pem
          python - <<'PY'
          from pathlib import Path
          pem = Path("hardware/cardputer-voice-terminal/firmware/src/isrgrootx1.pem").read_text().strip()
          Path("hardware/cardputer-voice-terminal/firmware/src/tls_ca.h").write_text(
              "#pragma once\\nstatic const char FREEZZ_TLS_CA_CERT[] PROGMEM = R\\"FREEZZ_CA(\\n"
              + pem + "\\n)FREEZZ_CA\\";\\n"
          )
          Path("hardware/cardputer-voice-terminal/firmware/src/device_config.h").write_text(
              '#pragma once\\n#define FREEZZ_HUB_HOST "test.tailnet.ts.net"\\n'
              '#define FREEZZ_HUB_PORT 443\\n#define FREEZZ_HUB_TLS 1\\n'
              '#define FREEZZ_DEVICE_TOKEN "' + ("a" * 64) + '"\\n'
          )
          PY
      - name: Compile verified WSS firmware path
        run: pio run -d hardware/cardputer-voice-terminal/firmware
      - name: Remove test credentials and build generic firmware
        run: |
          rm -f hardware/cardputer-voice-terminal/firmware/src/device_config.h
          rm -f hardware/cardputer-voice-terminal/firmware/src/tls_ca.h
          rm -f hardware/cardputer-voice-terminal/firmware/src/isrgrootx1.pem
          pio run -d hardware/cardputer-voice-terminal/firmware
      - name: Upload Cardputer ADV firmware
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-adv-firmware
          path: hardware/cardputer-voice-terminal/firmware/.pio/build/cardputer-adv/firmware.bin
          if-no-files-found: error
          retention-days: 7
