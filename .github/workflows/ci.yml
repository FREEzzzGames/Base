name: FREEzzz Platform Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  pages: write
  id-token: write

# RELEASE RULE:
# Never cancel an earlier validation run just because a newer commit arrived.
# Every main commit gets a deterministic validation; production deployment is
# serialized separately and only runs after the matching build job succeeds.
concurrency:
  # Every commit validates independently. Production deployment remains serialized.
  group: freezzz-pages-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install

      - name: Source integrity preflight
        shell: bash
        run: |
          set -euo pipefail

          test -f src/main.ts
          test -f src/portal-ui.ts
          test -f src/live-runtime.ts
          test -f src/platform-bridge.ts
          test -f src/radio-config.ts
          test ! -e src/game-runtime.ts
          test ! -e scripts/fetch-tabler.mjs

          # Architecture debt guards: stale HOME refresh loops and global DOM mutation
          # observers must not return after the cleanup pass.
          if grep -RInE 'homeRefreshTimer|refreshHomeContent|ensureHomeRefresh' src/main.ts; then
            echo "Stale HOME refresh machinery detected."
            exit 1
          fi
          if grep -RInE 'new MutationObserver\(' src/multi-window-portal.ts; then
            echo "Global mutation observers are not allowed in the multi-window runtime."
            exit 1
          fi

          # No removed UI/runtime features may return through stale source files.
          if grep -RInE 'game-font|gameFont|data-game-font|font-size control|freezzz:game-font-size|editor-layout|data-editor-' src package.json; then
            echo "Obsolete runtime/UI traces detected."
            exit 1
          fi

          # Validate every relative TypeScript import resolves to a source file.
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          const roots = ["src/main.ts","src/core/portal-core.ts","src/live-runtime.ts","src/platform-bridge.ts","src/portal-i18n.ts","src/portal-ui.ts","src/profile-store.ts","src/radio-browser.ts","src/radio-config.ts"];
          const missing = [];
          for (const file of roots) {
            const source = readFileSync(file, "utf8");
            for (const match of source.matchAll(/from\s+["'](\.[^"']+)["']/g)) {
              const base = resolve(dirname(file), match[1]);
              const candidates = [base, base+".ts", base+".js"];
              if (!candidates.some(existsSync)) missing.push(file+" -> "+match[1]);
            }
          }
          if (missing.length) {
            console.error(missing.join("\\n"));
            process.exit(1);
          }
          console.log("RELATIVE_IMPORTS_OK");
          NODE

          # Catch the exact class of regressions that previously appeared during
          # the main.ts extraction: missing shared exports and missing local handlers.
          grep -Eq '^export[[:space:]]+function icon\(' src/portal-ui.ts
          grep -Eq '^export const streams' src/portal-ui.ts
          grep -Eq '^function openLivePopup\(' src/main.ts
          grep -Eq '^function closeLivePopup\(' src/main.ts

          # There must be one Pages deployment workflow, not competing pipelines.
          deploy_count="$(grep -RIl 'actions/deploy-pages@' .github/workflows 2>/dev/null | wc -l | tr -d ' ')"
          upload_count="$(grep -RIl 'actions/upload-pages-artifact@' .github/workflows 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$deploy_count" != "1" ] || [ "$upload_count" != "1" ]; then
            echo "Expected exactly one Pages deploy workflow and one Pages artifact workflow."
            echo "deploy_count=$deploy_count upload_count=$upload_count"
            exit 1
          fi

          grep -q 'npm run typecheck' .github/workflows/ci.yml
          grep -q 'npm run build' .github/workflows/ci.yml
          grep -q 'node scripts/release-smoke.mjs' .github/workflows/ci.yml
          grep -q 'needs: build' .github/workflows/ci.yml

          echo "SOURCE_PREFLIGHT_OK"

      - name: Stamp portal build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat > src/build-info.ts <<EOF
          export const PORTAL_VERSION = "$(node -p 'require("./package.json").version')";
          export const PORTAL_BUILD_ID = "$GITHUB_SHA";
          EOF
          node -e 'const fs=require("fs"); const p=require("./package.json"); const b=process.env.GITHUB_SHA; fs.writeFileSync("public/version.json", JSON.stringify({version:p.version,build:b,generatedAt:new Date().toISOString()}));'
          node -e 'const fs=require("fs"); const s=fs.readFileSync("src/build-info.ts","utf8"); if(!s.includes(process.env.GITHUB_SHA)) throw new Error("build-info.ts was not stamped with GITHUB_SHA");'

      - name: Validate SPARK runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const html = readFileSync("public/spark.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*src=["']([^"']+)["'][^>]*>/gi)].map(m => m[1].replace(/^\.\//, ""));
          for (const required of ["spark-data.js", "spark-physics.js", "spark-effects.js", "spark-audio.js", "spark-ai.js", "spark-render.js", "spark-simulation.js", "spark-session.js", "spark.js"]) {
            if (!scripts.includes(required)) throw new Error("Missing SPARK script reference: " + required);
          }
          const runtime = readFileSync("public/spark.js", "utf8");
          const data = readFileSync("public/spark-data.js", "utf8");
          const ai = readFileSync("public/spark-ai.js", "utf8");
          const render = readFileSync("public/spark-render.js", "utf8");
          const simulation = readFileSync("public/spark-simulation.js", "utf8");
          const session = readFileSync("public/spark-session.js", "utf8");
          const physics = readFileSync("public/spark-physics.js", "utf8");
          const effects = readFileSync("public/spark-effects.js", "utf8");
          const audio = readFileSync("public/spark-audio.js", "utf8");
          if (!runtime.includes("SparkSimulation.start(update,renderFrame)")) throw new Error("SPARK scheduler is not wired to runtime");
          if (!runtime.includes("SparkData.createPlayer(ground)")) throw new Error("SPARK data module is not wired to runtime");
          if (!runtime.includes("SparkAI.nearestTarget")) throw new Error("SPARK AI module is not wired to runtime");
          if (!runtime.includes("SparkRenderMath.smoothPose")) throw new Error("SPARK render math is not wired to runtime");
          if (!runtime.includes("SparkSession.later")) throw new Error("SPARK session module is not wired to runtime");
          if (!runtime.includes("function reset()")) throw new Error("SPARK reset handler missing");
          if (!runtime.includes("SparkPhysics.segmentHitsRect")) throw new Error("SPARK runtime is not wired to physics module");
          if (!runtime.includes("SparkEffects.burst(fx")) throw new Error("SPARK runtime is not wired to effects module");
          if (!runtime.includes("SparkEffects.shoot(bullets")) throw new Error("SPARK runtime is not wired to projectile module");
          if (!runtime.includes("SparkAudio.beep(soundEnabled")) throw new Error("SPARK runtime is not wired to audio module");
          if (!physics.includes("segmentHitsRect")) throw new Error("SPARK segment collision primitive missing");
          if (!effects.includes("function burst(") || !effects.includes("function shoot(")) throw new Error("SPARK effects primitives missing");
          if (!audio.includes("function beep(")) throw new Error("SPARK audio primitive missing");
          if (!data.includes("function createPlayer(")) throw new Error("SPARK data factory missing");
          if (!ai.includes("function nearestTarget(") || !ai.includes("function bossPhase(") || !ai.includes("function updateEnemies(") || !ai.includes("function updateBoss(")) throw new Error("SPARK AI decisions/enemy/boss behavior missing");
          if (!render.includes("function smoothPose(") || !render.includes("function drawRigLink(") || !render.includes("function drawRigHinge(") || !render.includes("function solve2Bone(") || !render.includes("function pivot(") || !render.includes("function interpolateActors(")) throw new Error("SPARK render helpers missing");
          if (!simulation.includes("function start(") || !simulation.includes("function resetClock(")) throw new Error("SPARK simulation lifecycle missing");
          if (!session.includes("function later(") || !session.includes("function clear(")) throw new Error("SPARK session lifecycle missing");
          console.log("SPARK_RUNTIME_REFERENCE_OK");
          NODE
          node --check public/spark-physics.js
          node --check public/spark-effects.js
          node --check public/spark-data.js
          node --check public/spark-physics.js
          node --check public/spark-effects.js
          node --check public/spark-audio.js
          node --check public/spark-ai.js
          node --check public/spark-render.js
          node --check public/spark-simulation.js
          node --check public/spark-session.js
          node --check public/spark.js
          node --test public/spark-physics.test.mjs public/spark-effects.test.mjs public/spark-audio.test.mjs public/spark-ai.test.mjs public/spark-render.test.mjs

      - name: Telegram auth unit tests
        run: node --test server/telegram-auth.test.mjs
      - name: Telegram gateway syntax check
        run: node --check server/index.mjs


      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        env:
          VITE_TELEGRAM_AUTH_URL: ${{ secrets.TELEGRAM_AUTH_URL }}
        run: npm run build

      - name: Verify local portal videos
        shell: bash
        run: |
          set -euo pipefail
          for video in \
            hud-background.mp4 \
            home-hero.mp4 \
            home-live.mp4 \
            home-chat.mp4 \
            home-game.mp4 \
            home-radio.mp4 \
            home-library.mp4
          do
            test -s "dist/videos/$video"
          done
          echo "LOCAL_PORTAL_VIDEOS_OK"
          ls -lh dist/videos/*.mp4

      - name: Release smoke
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: node scripts/release-smoke.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    # Only one Pages deployment may publish at a time; a newer main commit takes over.
    concurrency:
      group: pages-production
      cancel-in-progress: true
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Verify published build
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.deployment.outputs.page_url }}"
          base_url="${base_url%/}"
          expected="${GITHUB_SHA}"
          published=""
          for attempt in $(seq 1 24); do
            published="$(curl -fsSL --connect-timeout 10 --max-time 20 \
              "${base_url}/version.json?verify=${expected}" 2>/dev/null || true)"
            if [ -n "${published}" ]; then
              build="$(node -e 'const fs=require("fs"); const s=fs.readFileSync(0,"utf8"); try { const j=JSON.parse(s); process.stdout.write(j.build || ""); } catch { process.stdout.write(""); }' <<<"${published}")"
              if [ "${build}" = "${expected}" ]; then
                echo "PUBLISHED_BUILD_OK: ${build}"
                exit 0
              fi
              echo "Published build is ${build:-<missing>}; expected ${expected}; retrying (${attempt}/24)."
            else
              echo "version.json not reachable yet; retrying (${attempt}/24)."
            fi
            sleep 5
          done
          echo "Published Pages build did not match GITHUB_SHA=${expected}."
          exit 1
