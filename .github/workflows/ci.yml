name: FREEzzz Platform Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Stamp portal build
        shell: bash
        run: |
          mkdir -p src/public
          node -e 'const fs=require("fs"); const p=require("./package.json"); const b=process.env.GITHUB_SHA; fs.writeFileSync("src/build-info.ts", "export const PORTAL_VERSION = \"" + p.version + "\";\\nexport const PORTAL_BUILD_ID = \"" + b + "\";\\n"); fs.writeFileSync("src/public/version.json", JSON.stringify({version:p.version,build:b,generatedAt:new Date().toISOString()}));'

      - run: npm run typecheck
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
