name: Deploy FREEzzz Agent System

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/agent-system
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install
        env:
          CI: true

      - name: Prepare Cloudflare KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '{"name":"agent-bootstrap","compatibility_date":"2026-01-01"}' > /tmp/agent-bootstrap.jsonc
          npx wrangler kv namespace list --json --config /tmp/agent-bootstrap.jsonc > /tmp/agent-kv-list.json
          KV_ID=$(node -e "const d=require('/tmp/agent-kv-list.json'); const a=Array.isArray(d)?d:(d.result||[]); const n=a.find(x=>x.title==='freezzz-agent-tasks'); console.log(n?.id||'')")
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create freezzz-agent-tasks --json --config /tmp/agent-bootstrap.jsonc > /tmp/agent-kv-create.json
            KV_ID=$(node -e "const d=require('/tmp/agent-kv-create.json'); console.log(d.id||d.result?.id||'')")
          fi
          if [ -z "$KV_ID" ]; then echo "Could not resolve KV namespace ID"; exit 1; fi
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$KV_ID/" wrangler.jsonc

      - name: Deploy Worker and Workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure bridge secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_BRIDGE_SECRET: ${{ secrets.AGENT_BRIDGE_SECRET }}
        run: |
          if [ -z "$AGENT_BRIDGE_SECRET" ]; then echo "AGENT_BRIDGE_SECRET repository secret is required"; exit 1; fi
          printf '%s' "$AGENT_BRIDGE_SECRET" | npx wrangler secret put AGENT_BRIDGE_SECRET

