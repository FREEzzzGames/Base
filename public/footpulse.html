<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="FootPulse — футбольные матчи, статистика и открытые данные внутри FREEzzz">
  <title>FootPulse — FREEzzz</title>
  <style>
    :root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--line:#29313d;--text:#f4f6f8;--muted:#9ca8b7;--accent:#ff394d}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
    body{display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .bar{min-height:54px;flex:0 0 54px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:#0b0f15}
    .back,.open,.reload{display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid var(--line);border-radius:9px;color:var(--text);text-decoration:none;background:#10151d}
    .back{width:38px;flex:0 0 38px;font-size:21px}
    .brand{font-weight:850;letter-spacing:.08em;font-size:14px;white-space:nowrap}.brand span{color:var(--accent)}
    .actions{margin-left:auto;display:flex;align-items:center;gap:7px}
    .open,.reload{padding:0 10px;font-size:11px;white-space:nowrap}
    .open{border-color:#74303a;background:#261016}
    main{position:relative;flex:1;min-height:0;background:var(--bg)}
    iframe{display:block;border:0;width:100%;height:100%;background:var(--bg)}
    .loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);text-align:center}
    .loading[hidden]{display:none}
    .loading-card{width:min(340px,100%);padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
    .spinner{width:26px;height:26px;margin:0 auto 16px;border:2px solid #333d49;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    .loading p{color:var(--muted);font-size:12px;line-height:1.65}
    .loading a{display:inline-flex;margin-top:8px;padding:11px 14px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-weight:750;font-size:12px}
    .loading .retry{margin-left:6px;border:1px solid var(--line);background:#10151d}
    .hint{position:absolute;right:8px;bottom:8px;z-index:1;padding:6px 8px;border:1px solid #29313dcc;border-radius:7px;background:#080b10dd;color:var(--muted);font-size:10px;pointer-events:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:380px){.bar{gap:7px;padding:0 8px}.brand{font-size:12px}.open,.reload{padding:0 7px;font-size:10px}.actions{gap:5px}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <header class="bar">
    <a class="back" href="./index.html" aria-label="Вернуться в FREEzzz">‹</a>
    <div class="brand">FOOT<span>PULSE</span></div>
    <div class="actions">
      <button class="reload" id="reload" type="button">↻ Обновить</button>
      <a class="open" href="https://footpulse-bzve.onrender.com/" target="_blank" rel="noopener noreferrer">Открыть отдельно ↗</a>
    </div>
  </header>
  <main>
    <iframe id="footpulse-app" src="https://footpulse-bzve.onrender.com/" title="FootPulse — футбольные матчи и статистика" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe>
    <section class="loading" id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="spinner" aria-hidden="true"></div>
        <strong id="loading-title">Подключаем FootPulse…</strong>
        <p id="loading-message">Бесплатный сервер может запускаться до минуты. Не закрывайте страницу, пока приложение загружается.</p>
        <a href="https://footpulse-bzve.onrender.com/" target="_blank" rel="noopener noreferrer">Открыть отдельно ↗</a>
        <button class="retry" id="retry" type="button">Повторить</button>
      </div>
    </section>
    <div class="hint" id="hint" hidden>Если экран пустой — откройте приложение отдельно ↗</div>
  </main>
  <script>
    (() => {
      const frame = document.getElementById("footpulse-app");
      const loading = document.getElementById("loading");
      const title = document.getElementById("loading-title");
      const message = document.getElementById("loading-message");
      const hint = document.getElementById("hint");
      let timer = 0;
      let generation = 0;

      function startLoad() {
        generation += 1;
        const current = generation;
        window.clearTimeout(timer);
        loading.hidden = false;
        hint.hidden = true;
        title.textContent = "Подключаем FootPulse…";
        message.textContent = "Бесплатный сервер может запускаться до минуты. Не закрывайте страницу, пока приложение загружается.";
        timer = window.setTimeout(() => {
          if (current !== generation) return;
          title.textContent = "Загрузка занимает больше времени";
          message.textContent = "Сервер может запускаться или быть временно недоступен. Попробуйте повторить загрузку или открыть FootPulse отдельно.";
        }, 15000);
        frame.src = "https://footpulse-bzve.onrender.com/?portal=freezzz&ts=" + Date.now();
      }

      frame.addEventListener("load", () => {
        window.clearTimeout(timer);
        loading.hidden = true;
        hint.hidden = false;
      });

      document.getElementById("reload").addEventListener("click", startLoad);
      document.getElementById("retry").addEventListener("click", startLoad);
      startLoad();
    })();
  </script>
</body>
</html>
