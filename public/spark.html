function frame(t){requestAnimationFrame(frame);if(!last)last=t;var dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;if(document.hidden){acc=0;return}acc+=dt;var n=0;while(acc>=1/60&&n<5){update(1/60);acc-=1/60;n++}if(n===5)acc=0;draw()}
