 {sender:"MIRROR",role:"МЕДИА-КОНТУР",title:"Кому принадлежит восстановление",text:"Политические группы пытаются присвоить себе заслуги за стабилизацию. Публика ждёт понятного ответа, кто заплатил за кризис.",choices:[
 ["Публиковать проверяемые отчёты о расходах",{stability:4,economy:1,shadow:-4,funds:-4,flag:"open_spending",note:"Подотчётность укреплена."}],
 ["Сфокусировать эфир на признаках роста",{stability:1,economy:2,shadow:-2,funds:-3,flag:"growth_narrative",note:"Оптимизм усилился, но вопросы не исчезли."}],
 ["Разделить аудиторию конкурирующими темами",{stability:-4,economy:0,shadow:-5,funds:-4,flag:"fragmented_attention",note:"Контроль повестки краткосрочный."}]]},
 {sender:"NORTHSTAR",role:"ОПЕРАТИВНЫЙ КУРАТОР",title:"Перенаправление капитала",text:"Открывается короткое окно, чтобы вложить ресурсы в инфраструктуру, независимые институты или закрытые сети влияния.",choices:[
 ["Финансировать инфраструктурный узел",{stability:3,economy:5,shadow:-3,funds:-16,flag:"infra_node",note:"Долгосрочная экономика получает импульс."}],
 ["Укрепить независимые институты проверки",{stability:5,economy:1,shadow:1,funds:-10,flag:"institutional_checks",note:"Система устойчивее к манипуляциям."}],
 ["Расширить сеть закрытых посредников",{stability:-2,economy:3,shadow:-8,funds:-12,flag:"proxy_network",note:"Скрытый охват увеличен, риск утечек вырос."}]]},
 {sender:"ARCHIVIST",role:"ГОДОВОЙ СИНТЕЗ",title:"Резонанс 2009",text:"Первая фаза кризиса позади. Сохраните то, что работает, и определите, какой тип влияния будет доминировать в следующем десятилетии.",choices:[
 ["Закрепить прозрачные правила вмешательства",{stability:5,economy:2,shadow:-2,funds:-6,flag:"rules_based",note:"Устойчивость укреплена, часть скрытности потеряна."}],
 ["Сохранить гибкость закрытой сети",{stability:0,economy:2,shadow:3,funds:-4,flag:"adaptive_network",note:"Манёвр сохранён."}],
 ["Направить средства в разведку долгого цикла",{stability:1,economy:0,shadow:-1,funds:-10,flag:"long_cycle_intel",note:"Подготовка к будущим кризисам усилена."}]]}
]};
const genericThemes=[
 ["Цифровая инфраструктура и новые рынки","Технологические платформы концентрируют влияние, а регуляторы не успевают за изменениями."],
 ["Энергетическая и логистическая уязвимость","Сбой в цепочках поставок начинает влиять на цены и политические решения."],
 ["Информационный кризис","Слухи, утечки и поддельные материалы распространяются быстрее официальной проверки."],
 ["Региональная напряжённость","Локальный конфликт угрожает перерасти в международный кризис."],
 ["Доверие к институтам","Общество требует объяснений, а закрытые структуры опасаются раскрытия своих связей."]
];
function buildLaterYear(year){
 const themes=genericThemes;
 return missionTypes.map((type,i)=>{
  const theme=themes[(year+i)%themes.length];
  const base=[
   {label:"Провести независимую проверку",delta:{stability:3,economy:1,shadow:-3,funds:-8},flag:"audit_"+year+"_"+i,note:"Надёжность данных повышена."},
   {label:"Использовать закрытого посредника",delta:{stability:-1,economy:3,shadow:-6,funds:-7},flag:"proxy_"+year+"_"+i,note:"Влияние усилено, риск обнаружения вырос."},
   {label:"Сохранить ресурсы и выждать",delta:{stability:-2,economy:0,shadow:2,funds:1},flag:"wait_"+year+"_"+i,note:"Резервы сохранены, кризис остаётся открытым."}
  ];
  if(i===1)base[0].delta={stability:4,economy:4,shadow:-3,funds:-14};
  if(i===2)base[0].delta={stability:4,economy:0,shadow:-4,funds:-4};
  if(i===3)base[0].delta={stability:2,economy:3,shadow:-4,funds:-10};
  if(i===4)base[0].delta={stability:4,economy:2,shadow:-2,funds:-5};
  return {sender:["SABLE-7","MORROW","MIRROR","NORTHSTAR","ARCHIVIST"][i],role:type.tag,title:theme[0],text:year+": "+theme[1]+"\n\nКанал ShadowOS предлагает три курса действий. Их последствия складываются с решениями прошлых лет и накопленными скрытыми флагами.",choices:base.map(b=>[b.label,{label:b.label,stability:b.delta.stability,economy:b.delta.economy,shadow:b.delta.shadow,funds:b.delta.funds,flag:b.flag,note:b.note}])};
 });
}
function getEvent(){const raw=(events[state.year]||buildLaterYear(state.year))[state.mission];return {...raw,choices:raw.choices.map(choice=>Array.isArray(choice)?{label:choice[0],...choice[1]}:choice)};}
let state=loadState();
let activeApp="whisper",toastTimer=0;
function loadState(){
 try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&Number.isInteger(parsed.year)&&parsed.year>=2007&&parsed.year<=2027&&Number.isInteger(parsed.mission)&&parsed.mission>=0&&parsed.mission<5)return {...structuredClone(INITIAL),...parsed,flags:parsed.flags||{},history:Array.isArray(parsed.history)?parsed.history:[],news:Array.isArray(parsed.news)?parsed.news:[]};}}catch{}
 return structuredClone(INITIAL);
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch{notify("Сохранение недоступно в этом режиме браузера.",true);}}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function dateText(){return state.year+" · Q"+(Math.floor(state.mission*4/5)+1);}
function notify(message,danger=false){const t=document.getElementById("toast");t.textContent=message;t.classList.toggle("danger",danger);t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2600);}
function pulseRender(){
 const defs=[["🌍","STABILITY",state.stability,100],["📈","ECONOMY",state.economy,100],["⚠","DEFCON",state.defcon,5],["◉","SHADOW",state.shadow,100]];
 document.getElementById("pulse").innerHTML=defs.map(([ico,label,value,max])=>{const percent=label==="DEFCON"?Number(value)/5*100:Number(value);return '<div class="pulse-item"><div class="pulse-label">'+ico+" "+label+'</div><div class="pulse-value '+(label==="DEFCON"&&value>=4?"warn":"")+'">'+(label==="DEFCON"?value+"/5":Math.round(value)+"%")+'</div><div class="pulse-bar"><i style="width:'+clamp(percent,0,100)+'%;'+(label==="DEFCON"&&value>=4?"background:var(--red)":"")+'"></i></div></div>';}).join("");
 document.getElementById("date-widget").innerHTML=state.year+" · Q"+(Math.floor(state.mission*4/5)+1)+"<br>MISSION "+(state.mission+1)+"/5";
}
function appHead(title,subtitle,badge="LOCAL NODE"){return '<div class="app-head"><div><div class="app-title">'+title+'</div><div class="app-subtitle">'+subtitle+'</div></div><span class="badge">'+badge+'</span></div>';}
function renderWhisper(){
 const e=getEvent(),type=missionTypes[state.mission];
 return appHead("💬 WHISPER",type.name+" · "+type.tag,"ENCRYPTED")+
 '<div class="mission-card"><div class="eyebrow">INCOMING MESSAGE · '+state.year+' / '+(state.mission+1)+'</div><div class="message-head"><div class="avatar">'+esc(e.sender.slice(0,2))+'</div><div><div class="sender">'+esc(e.sender)+'</div><div class="sender-meta">'+esc(e.role)+" · "+esc(e.title)+'</div></div></div><div class="message">'+esc(e.text)+'</div><div class="objective"><b>ЗАДАЧА</b><br>'+esc(type.objective)+'</div></div><div class="section-label">ВЫБЕРИТЕ ОТВЕТ · ОДИН ХОД</div><div class="choices">'+e.choices.map((c,i)=>'<button class="choice" type="button" data-choice="'+i+'"><b>'+String.fromCharCode(65+i)+'. '+esc(c.label)+'</b><span class="impact">Stability '+signed(c.stability||0)+' · Economy '+signed(c.economy||0)+' · Shadow '+signed(c.shadow||0)+(c.funds!==undefined?' · Funds '+signed(c.funds):'')+'</span></button>').join("")+'</div><div class="actionrow"><button class="secondary" data-app="dossier">ОТКРЫТЬ ДОСЬЕ</button><button class="primary" data-next>ЗАВЕРШИТЬ МИССИЮ →</button></div><div class="notice">Выберите один ответ. Затем завершите миссию, чтобы зафиксировать ход и перейти дальше. Скрытые флаги сохраняются.</div>';
}
function signed(n){return (n>0?"+":"")+n;}
function renderPulseFeed(){
 const feed=[...(state.news||[])].reverse().slice(0,8);
 if(!feed.length)feed.push({year:state.year,title:"Мониторинг активен",text:"Ожидается первое решение. Лента будет отражать ваши действия и реакцию мировых систем.",kind:"SYSTEM"});
 return appHead("📰 PULSE FEED","Медиа · события · последствия","LIVE")+'<div class="surface">'+feed.map(n=>'<div class="news-item"><div class="news-date">'+esc(n.year||state.year)+' · '+esc(n.kind||"INTEL")+'</div><div class="news-title">'+esc(n.title)+'</div><div class="news-copy">'+esc(n.text)+'</div></div>').join("")+'</div>';
}
function renderVault(){
 return appHead("▣ VAULT","Ресурсы теневого синдиката","PRIVATE")+'<div class="surface"><div class="eyebrow">AVAILABLE CAPITAL</div><div class="resource-row"><span>Ликвидные средства</span><strong>'+Math.round(state.funds)+' CR</strong></div><div class="resource-row"><span>Активные агенты</span><strong>'+state.agents+'</strong></div><div class="resource-row"><span>Разведывательные пакеты</span><strong>'+state.intel+'</strong></div><div class="resource-row"><span>Накопленные флаги</span><strong>'+Object.keys(state.flags).length+'</strong></div><div class="section-label">РЕЗЕРВНЫЕ ОПЕРАЦИИ</div><button class="choice" data-vault="stabilize"><b>01 · Стабилизационный пакет</b><span class="impact">−12 CR · Stability +3 · Economy +1</span></button><button class="choice" data-vault="intel"><b>02 · Финансировать разведку</b><span class="impact">−8 CR · Shadow −2 · +1 разведпакет</span></button><button class="choice" data-vault="reserve"><b>03 · Консервировать активы</b><span class="impact">+5 CR · Economy −1 · Shadow +1</span></button></div><div class="notice">Vault-операция использует ход ресурсов, но не заменяет ответ Whisper.</div>';
}
function renderGeoMap(){
 const regions=[["СЕВЕРНАЯ АТЛАНТИКА","Финансовые потоки · риск "+(state.economy<40?"ВЫСОКИЙ":"СРЕДНИЙ")],["ВОСТОЧНАЯ ЕВРОПА","Политическая напряжённость · DEFCON "+state.defcon],["ВОСТОЧНАЯ АЗИЯ","Технологические цепочки · стабильность "+Math.round(state.stability)+"%"],["ГЛОБАЛЬНЫЕ РЫНКИ","Экономика "+Math.round(state.economy)+"% · Shadow "+Math.round(state.shadow)+"%"]];
 return appHead("🛰️ GEOMAP","Условная карта кризисных узлов","STRATEGIC")+'<div class="surface"><div class="map-grid">'+regions.map(r=>'<div class="map-region"><strong>'+r[0]+'</strong><span>'+r[1]+'</span></div>').join("")+'</div><div class="section-label">АКТИВНЫЕ СИГНАЛЫ</div><div class="news-copy">Карта концептуальная: отображает игровые риски, а не реальные оперативные данные.</div></div>';
}
function renderDossier(){
 const flags=Object.entries(state.flags);
 return appHead("📂 DOSSIER","Досье · скрытые флаги · история","CLASSIFIED")+'<div class="surface"><div class="eyebrow">BUTTERFLY EFFECTS · '+flags.length+' FLAGS</div>'+(flags.length?flags.slice().reverse().map(([k,v])=>'<div class="dossier-item"><div class="news-title">'+esc(k.replaceAll("_"," ").toUpperCase())+'</div><div class="news-copy">'+esc(v.note||"Последствие сохранено")+' · '+esc(v.year||"")+'</div></div>').join(""):'<div class="empty">Досье пока пусто.<br>Примите решение в Whisper, чтобы создать первый след.</div>')+'<div class="section-label">ИСТОРИЯ РЕШЕНИЙ</div>'+(state.history.length?state.history.slice().reverse().slice(0,12).map(h=>'<div class="dossier-item"><div class="news-date">'+h.year+' · MISSION '+(h.mission+1)+'</div><div class="news-title">'+esc(h.title)+'</div><div class="news-copy">'+esc(h.choice)+'<br>'+esc(h.note)+'</div></div>').join(""):'<div class="empty">Решений пока нет.</div>')+'</div><div class="actionrow"><button class="secondary" data-export>ЭКСПОРТ SAVE</button><button class="secondary" data-reset>СБРОСИТЬ КАМПАНИЮ</button></div>';
}
function render(){
 pulseRender();
 const view=document.getElementById("appview");
 view.innerHTML=activeApp==="whisper"?renderWhisper():activeApp==="pulse"?renderPulseFeed():activeApp==="vault"?renderVault():activeApp==="geomap"?renderGeoMap():renderDossier();
 document.querySelectorAll("[data-app]").forEach(b=>{if(b.tagName==="BUTTON")b.addEventListener("click",()=>{activeApp=b.dataset.app;document.querySelectorAll(".nav button").forEach(n=>n.classList.toggle("active",n.dataset.app===activeApp));render();});});
 view.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.choice))));
 const nextButton=view.querySelector("[data-next]");if(nextButton){nextButton.disabled=!selectedChoice;nextButton.addEventListener("click",advanceMission);}
 view.querySelectorAll("[data-vault]").forEach(b=>b.addEventListener("click",()=>vaultAction(b.dataset.vault)));
 view.querySelector("[data-export]")?.addEventListener("click",exportSave);
 view.querySelector("[data-reset]")?.addEventListener("click",resetGame);
}
let selectedChoice=null;
function choose(index){
 if(state.gameOver)return;
 const event=getEvent(),choice=event.choices[index];if(!choice)return;
 selectedChoice={index,choice};
 document.querySelectorAll("[data-choice]").forEach((b,i)=>{b.style.borderColor=i===index?"var(--green)":"#2a3930";b.style.background=i===index?"#1b2b1d":"";b.setAttribute("aria-pressed",String(i===index));});
 document.querySelector("[data-next]").disabled=false;
 notify("Ответ выбран. Завершите миссию, чтобы применить последствия.");
}
function advanceMission(){
 if(state.gameOver)return;
 if(!selectedChoice){notify("Сначала выберите один из трёх ответов.",true);return;}
 const event=getEvent(),choice=event.choices[selectedChoice.index];
 const old={stability:state.stability,economy:state.economy,shadow:state.shadow,defcon:state.defcon};
 state.stability=clamp(state.stability+(choice.stability||0),0,100);
 state.economy=clamp(state.economy+(choice.economy||0),0,100);
 state.shadow=clamp(state.shadow+(choice.shadow||0),0,100);
 /* DEFCON is modeled here as threat level: 1 = low, 5 = catastrophic. */
 if((choice.stability||0)<=-5||(choice.economy||0)<=-7)state.defcon=clamp(state.defcon+1,1,5);
 else if((choice.stability||0)>=4&&(choice.shadow||0)>=-3)state.defcon=clamp(state.defcon-1,1,5);
 state.funds=Math.max(0,state.funds+(choice.funds||0));
 state.agents=clamp(state.agents+(choice.agents||0),0,10);
 if(choice.flag)state.flags[choice.flag]={note:choice.note,year:state.year,mission:state.mission};
 if(state.flags.trusted_intel&&state.flags.transparency&&state.mission===4)state.stability=clamp(state.stability+2,0,100);
 if(state.flags.censorship&&state.flags.verified_updates)state.shadow=clamp(state.shadow+1,0,100);
 if(state.flags.proxy_network&&state.flags.institutional_checks)state.stability=clamp(state.stability+1,0,100);
 const spike=Math.abs(state.stability-old.stability)>=5||Math.abs(state.economy-old.economy)>=5||Math.abs(state.shadow-old.shadow)>=6||state.defcon!==old.defcon;
 const note=choice.note+(state.flags.crisis_reserve&&state.year===2008?" Crisis reserve improved response capacity.":"")+(state.flags.trusted_intel&&state.year===2008?" Trusted intelligence channel remains available.":"");
 state.history.push({year:state.year,mission:state.mission,title:event.title,choice:choice.label,note,delta:{stability:state.stability-old.stability,economy:state.economy-old.economy,shadow:state.shadow-old.shadow,defcon:state.defcon-old.defcon},flag:choice.flag||null});
 state.news.push({year:state.year,title:event.title,text:note,kind:"DECISION"});
 state.lastOutcome={title:event.title,note,delta:{stability:state.stability-old.stability,economy:state.economy-old.economy,shadow:state.shadow-old.shadow,defcon:state.defcon-old.defcon}};
 selectedChoice=null;
 if(state.stability<=0)state.gameOver="Stability reached 0%";
 else if(state.economy<=0)state.gameOver="Economy reached 0%";
 else if(state.shadow<=0)state.gameOver="Shadow Index reached 0%";
 else if(state.defcon>=5)state.gameOver="DEFCON reached 5";
 if(!state.gameOver){if(state.mission<4)state.mission++;else if(state.year<2027){state.year++;state.mission=0;}else state.campaignComplete=true;}
 save();render();
 if(state.gameOver){showGameOver();return;}if(state.campaignComplete){showGameOver();notify("CAMPAIGN COMPLETE · 2027");return;}
 if(spike)notify("GLOBAL PULSE UPDATED · Резкое изменение показателей");
 else notify("МИССИЯ ЗАФИКСИРОВАНА · "+state.year);
}
function vaultAction(kind){
 if(kind==="stabilize"){if(state.funds<12){notify("Недостаточно средств в Vault.",true);return;}state.funds-=12;state.stability=clamp(state.stability+3,0,100);state.economy=clamp(state.economy+1,0,100);}
 else if(kind==="intel"){if(state.funds<8){notify("Недостаточно средств в Vault.",true);return;}state.funds-=8;state.shadow=clamp(state.shadow-2,0,100);state.intel++;}
 else if(kind==="reserve"){state.funds+=5;state.economy=clamp(state.economy-1,0,100);state.shadow=clamp(state.shadow+1,0,100);}
 state.news.push({year:state.year,title:"Vault operation",text:"Операция ресурсов: "+kind+". Изменения сохранены в состоянии мира.",kind:"VAULT"});
 if(state.stability<=0)state.gameOver="Stability reached 0%";else if(state.economy<=0)state.gameOver="Economy reached 0%";else if(state.shadow<=0)state.gameOver="Shadow Index reached 0%";else if(state.defcon>=5)state.gameOver="DEFCON reached 5";
 save();render();if(state.gameOver)showGameOver();else notify("VAULT UPDATED · Ресурсы и параметры пересчитаны.");
}
function showGameOver(){
 const g=document.getElementById("gameover"),won=!!state.campaignComplete;g.innerHTML='<div class="eyebrow">SHADOWOS · '+(won?"CAMPAIGN ARCHIVED":"SESSION TERMINATED")+'</div><h2 id="over-title" style="color:'+(won?"var(--green)":"var(--red)")+'">'+(won?"CAMPAIGN COMPLETE":"GAME OVER")+'</h2><p>'+(won?"Вы прошли все пять миссий каждого года с 2007 по 2027. Итоговые показатели и история решений сохранены.":"Причина поражения: <b>"+esc(state.gameOver)+"</b>.")+'</p><p>Год: '+state.year+'. История решений и скрытые флаги сохранены.</p><button class="primary" id="restart-over">НАЧАТЬ НОВУЮ КАМПАНИЮ</button>';g.hidden=false;g.querySelector("#restart-over").addEventListener("click",resetGame);
}
function resetGame(){
 if(!confirm("Сбросить кампанию ShadowOS и начать заново?"))return;
 state=structuredClone(INITIAL);selectedChoice=null;activeApp="whisper";document.querySelectorAll(".nav button").forEach(n=>n.classList.toggle("active",n.dataset.app===activeApp));document.getElementById("gameover").hidden=true;save();render();notify("НОВАЯ КАМПАНИЯ · 2007");
}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="shadowos-save-"+state.year+".json";a.click();URL.revokeObjectURL(url);notify("SAVE EXPORTED");}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{activeApp=b.dataset.app;document.querySelectorAll(".nav button").forEach(n=>n.classList.toggle("active",n===b));render();}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&activeApp!=="whisper"){activeApp="whisper";document.querySelectorAll(".nav button").forEach(n=>n.classList.toggle("active",n.dataset.app===activeApp));render();}});
function updateDeviceTime(){const d=new Date();document.getElementById("device-time").textContent=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});}
updateDeviceTime();setInterval(updateDeviceTime,30000);
render();
if(state.gameOver||state.campaignComplete)showGameOver();
</script>
</body>
