  </g>
  <g text-anchor="middle"><text x="250" y="380" fill="#f8fafc" font-family="monospace" font-size="26" font-weight="bold" letter-spacing="6">SHADOW OS</text><text x="250" y="415" fill="#64748b" font-family="monospace" font-size="12" font-weight="600" letter-spacing="4">SECURE // 2007-2027</text></g>
</svg>