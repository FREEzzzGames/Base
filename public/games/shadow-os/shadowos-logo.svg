<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">SHADOW OS</title>
  <desc id="desc">Secure terminal emblem, 2007–2027</desc>
  <defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs>
  <rect width="500" height="500" fill="#070a0e"/>
  <g transform="translate(250 210)" filter="url(#glow)">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="none" stroke="#1e293b" stroke-width="3"/>
    <polygon points="0,-80 70,-40 70,40 0,80 -70,40 -70,-40" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity=".6"/>
    <circle r="28" fill="#070a0e" stroke="#34d399" stroke-width="2"/><circle r="10" fill="#10b981"/>
    <path d="M0 -95V-115 M0 95V115 M-95 0H-115 M95 0H115" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <circle cx="70" cy="-40" r="4" fill="#34d399"/><circle cx="-70" cy="40" r="4" fill="#34d399"/>
