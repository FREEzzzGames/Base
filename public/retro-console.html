<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17120d">
<title>FREEzzz GAMES — CARGO DECK 1984</title>
<style>
:root{color-scheme:dark;--cream:#d6c4a0;--case:#b6a17c;--ink:#171817;--red:#ed3d32;--blue:#168de1;--cyan:#3ce8ed;--green:#37df69;--amber:#ffad35;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;color:var(--cream);font-family:ui-monospace,"Courier New",monospace;touch-action:none;user-select:none}
body{display:grid;place-items:center}
.console{position:relative;width:min(100vw,calc(100dvh * .585));height:min(100dvh,calc(100vw * 1.71));min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,.88fr) auto;gap:clamp(5px,1.2dvh,12px);padding:clamp(8px,2.3vw,18px);padding-top:calc(clamp(8px,2.3vw,18px) + var(--safe-t));padding-bottom:calc(clamp(8px,2.3vw,18px) + var(--safe-b));background:linear-gradient(135deg,#d9c7a2,#8f7c5f 42%,#c1ad87 62%,#75664e);border:3px solid #342f27;border-radius:clamp(14px,4vw,32px);box-shadow:inset 0 0 0 2px #f0dfb8,inset 0 0 0 7px #70624c,0 12px 40px #000b;overflow:hidden}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;color:#1b1c1a;font-weight:900;letter-spacing:.04em;font-size:clamp(10px,2.7vw,17px);text-shadow:0 1px #e8d9b8}
.brand small{font-size:clamp(7px,1.7vw,10px);letter-spacing:.08em}
.stripes{height:5px;width:24%;max-width:95px;background:linear-gradient(90deg,#d92e26 0 25%,#f3a22c 25% 50%,#2aa7b5 50% 75%,#314f91 75%);margin:4px 0 0}
.screen-frame{position:relative;min-height:0;padding:clamp(5px,1.3vw,10px);background:#171817;border:2px solid #514938;border-radius:12px;box-shadow:inset 0 0 0 2px #070808,inset 0 0 0 4px #84765d}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#050b12;border:2px solid #050606;border-radius:5px}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0004 4px);opacity:.45;mix-blend-mode:multiply}
.hud{position:absolute;left:7px;right:7px;top:6px;display:flex;justify-content:space-between;gap:8px;font-size:clamp(8px,2vw,12px);font-weight:900;text-shadow:1px 1px #000;color:#f5e6c6;pointer-events:none}
.hud-box{background:#07111de0;border:1px solid #327a8b;padding:4px 5px;min-width:26%}
.bar{height:5px;background:#20252a;margin-top:3px}.bar i{display:block;height:100%;width:100%;background:var(--green)}.energy i{background:var(--cyan)}
.caption{display:flex;align-items:center;justify-content:space-between;color:#241f18;font-weight:900;font-size:clamp(8px,2.1vw,12px);letter-spacing:.08em;padding:0 4px}
.control-deck{min-height:0;display:grid;grid-template-columns:1fr 1.08fr;gap:clamp(6px,1.8vw,14px);padding:clamp(5px,1.2vw,9px);background:linear-gradient(145deg,#242522,#111311);border:2px solid #75664c;border-radius:12px;box-shadow:inset 0 0 0 2px #080908,inset 0 1px 0 #ffffff22}
.move-column{display:flex;flex-direction:column;min-width:0;align-items:center;justify-content:center;gap:8px}
.label{color:#e1d0aa;font-size:clamp(8px,2vw,12px);font-weight:900;letter-spacing:.08em;text-align:center;text-shadow:1px 2px #000}
.move-pad{position:relative;width:min(100%,28dvh,42vw);aspect-ratio:1;border-radius:50%;border:clamp(4px,1.1vw,8px) solid #6d6b60;background:radial-gradient(circle,#242729 0 54%,#111416 56% 70%,#292c2d 72%);box-shadow:inset 0 0 0 3px #080a0b,0 4px 0 #050606,0 0 0 2px #b1a17d;touch-action:none}
.move-pad:before{content:"";position:absolute;inset:9%;border-radius:50%;border:2px dashed #38dfe4aa}
.move-pad:after{content:"";position:absolute;inset:17%;border-radius:50%;border:1px solid #ffffff18}
.knob{position:absolute;left:50%;top:50%;width:35%;height:35%;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#515654,#1a1d1d);border:2px solid #737b78;box-shadow:inset 0 2px #ffffff24,0 4px 7px #000b;pointer-events:none}
.arrow{position:absolute;color:#89918c;font-size:clamp(10px,3vw,18px);font-weight:900}.up{top:5%;left:47%}.down{bottom:5%;left:47%}.left{left:5%;top:46%}.right{right:5%;top:46%}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1.3fr 1fr;gap:clamp(4px,1.1vw,9px);align-items:center;justify-items:center;min-width:0}
.key{--c:var(--blue);width:100%;max-width:clamp(38px,10vw,72px);aspect-ratio:1;border-radius:50%;border:clamp(3px,.8vw,6px) solid #101110;background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c),white 20%),var(--c) 35%,#07305b 74%,#080909 77%);box-shadow:inset 0 0 0 2px #a8a18c, inset 0 2px 5px #fff5,0 3px 0 #050606,0 0 0 1px #77705c;color:#fff4d5;text-shadow:1px 2px #111;font-weight:1000;font-size:clamp(12px,3.4vw,23px);display:grid;place-items:center;touch-action:manipulation;padding:0}
.key:active,.key.pressed{transform:translateY(2px) scale(.96);filter:brightness(1.35);box-shadow:inset 0 0 0 3px #fff8,0 1px 0 #050606,0 0 13px var(--c)}
.key.red{--c:var(--red)}.key.amber{--c:var(--amber)}.key.blue{--c:var(--blue)}.key.green{--c:var(--green)}
.key.attack{max-width:clamp(56px,15vw,96px);grid-column:2/4;grid-row:2;font-size:clamp(23px,6vw,38px);--c:#f12f2b}
.key.skill1{grid-column:1;grid-row:1}.key.skill2{grid-column:2;grid-row:1}.key.skill3{grid-column:3;grid-row:1}
.key.vengeance{grid-column:1;grid-row:2}.key.recall{grid-column:1;grid-row:3}.key.regen{grid-column:2;grid-row:3}.key.battle{grid-column:3;grid-row:3}
.key.skill1:after{content:"3"}.key.skill2:after{content:"1"}.key.skill3:after{content:"3"}
.key.vengeance:after{content:"◉";font-size:clamp(15px,4vw,24px)}.key.recall:after{content:"♨"}.key.regen:after{content:"✦"}.key.battle:after{content:"♟"}
.key .cd{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:#0009;font-size:12px}
.key{position:relative}
.control-label{font-size:clamp(6px,1.55vw,10px);color:#e2d4b6;text-align:center;font-weight:900;line-height:1.1;margin-top:3px}
.action-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:0}
.attack-wrap{grid-column:2/4;grid-row:2}
.vengeance-wrap{grid-column:1;grid-row:2}
.recall-wrap{grid-column:1;grid-row:3}
.regen-wrap{grid-column:2;grid-row:3}
.battle-wrap{grid-column:3;grid-row:3}
.footer{display:flex;justify-content:space-between;gap:6px;align-items:center;color:#29241c;font-weight:900;font-size:clamp(7px,1.8vw,10px);letter-spacing:.06em}
.footer button{border:1px solid #544a38;background:#c2ae88;color:#211d16;font:inherit;padding:4px 7px;border-radius:4px}
@media(max-height:560px){.console{gap:4px;grid-template-rows:auto minmax(0,1fr) auto minmax(0,.78fr) auto}.brand{font-size:10px}.move-pad{width:min(100%,24dvh,34vw)}.label{font-size:8px}.control-deck{padding:5px}.key{max-width:clamp(30px,8vh,56px)}.key.attack{max-width:clamp(42px,11vh,72px)}}
</style>
</head>
<body>
<div class="console" role="application" aria-label="FREEzzz retro handheld game console">
  <div><div class="brand"><span>▰ FREEzzz GAMES</span><small>MODEL 1984 · PORTABLE</small></div><div class="stripes"></div></div>
  <section class="screen-frame" aria-label="Игровой экран">
    <div class="screen"><canvas id="game" aria-label="Игровая арена"></canvas><div class="hud"><div class="hud-box">HP <div class="bar"><i id="hpbar"></i></div></div><div class="hud-box">WAVE <span id="wave">01</span><div class="bar energy"><i id="energybar"></i></div></div><div class="hud-box">SCORE <span id="score">0000</span></div></div><div class="scan"></div></div>
  </section>
  <div class="caption"><span>CARGO DECK</span><span id="status">INSERT COIN · TAP ATTACK</span></div>
  <section class="control-deck" aria-label="Панель управления">
    <div class="move-column"><div class="label">MOVE / 360°</div><div class="move-pad" id="movePad" aria-label="Сенсор движения"><span class="arrow up">▲</span><span class="arrow down">▼</span><span class="arrow left">◀</span><span class="arrow right">▶</span><div class="knob" id="knob"></div></div><div class="label">DIRECTION SENSOR</div></div>
    <div class="actions">
      <div class="action-wrap skill1-wrap"><button class="key red skill1" data-action="skill1" aria-label="Skill 1"></button><span class="control-label">SKILL 1</span></div>
      <div class="action-wrap skill2-wrap"><button class="key amber skill2" data-action="skill2" aria-label="Skill 2"></button><span class="control-label">SKILL 2</span></div>
      <div class="action-wrap skill3-wrap"><button class="key blue skill3" data-action="skill3" aria-label="Skill 3"></button><span class="control-label">SKILL 3</span></div>
      <div class="action-wrap vengeance-wrap"><button class="key blue" data-action="vengeance" aria-label="Vengeance"></button><span class="control-label">VENGEANCE</span></div>
      <div class="action-wrap attack-wrap"><button class="key attack" data-action="attack" aria-label="Attack">⚔</button><span class="control-label">ATTACK</span></div>
      <div class="action-wrap recall-wrap"><button class="key blue" data-action="recall" aria-label="Recall"></button><span class="control-label">RECALL</span></div>
      <div class="action-wrap regen-wrap"><button class="key green" data-action="regen" aria-label="Regen"></button><span class="control-label">REGEN</span></div>
      <div class="action-wrap battle-wrap"><button class="key amber" data-action="battle" aria-label="Battle Spell"></button><span class="control-label">BATTLE SPELL</span></div>
    </div>
  </section>
  <div class="footer"><span>CRT · 8-BIT ACTION SYSTEM</span><button id="restart" type="button">RESET ↻</button></div>
</div>
<script>
(()=>{'use strict';
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();}catch{}
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false}),pad=document.getElementById('movePad'),knob=document.getElementById('knob');
const hpbar=document.getElementById('hpbar'),energybar=document.getElementById('energybar'),scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),statusEl=document.getElementById('status');
let w=360,h=540,dpr=1,last=0,elapsed=0,score=0,wave=1,nextWaveScore=100,spawnTimer=0,attackHeld=false,movePointer=null,move={x:0,y:0},shots=[],enemies=[],particles=[],cooldowns={skill1:0,skill2:0,skill3:0,vengeance:0,recall:0,regen:0,battle:0},energy=100,health=100,shield=0,dead=false;
const player={x:180,y:390,r:8,speed:150,invuln:0};
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));w=r.width;h=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);player.x=Math.min(w-20,Math.max(20,player.x));player.y=Math.min(h-20,Math.max(35,player.y));}
window.addEventListener('resize',resize,{passive:true});resize();
function reset(){score=0;wave=1;nextWaveScore=100;spawnTimer=.3;shots=[];enemies=[];particles=[];health=100;energy=100;shield=0;dead=false;player.x=w/2;player.y=h*.72;player.invuln=0;Object.keys(cooldowns).forEach(k=>cooldowns[k]=0);statusEl.textContent='WAVE 01 · ENGAGE';}
function spawn(){const side=Math.random();let x=side*w,y=-15;if(side>.5){x=Math.random()*w;y=-10;}const boss=wave%4===0&&enemies.length===0;enemies.push({x:Math.max(12,Math.min(w-12,x)),y,r:boss?15:7+Math.random()*3,hp:boss?10:2,speed:boss?20:28+Math.random()*20,fire:1+Math.random()*2,boss});}
function particle(x,y,color,n=5){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.45,color});}}
function fire(){if(dead)return;const target=enemies.reduce((best,e)=>!best||Math.hypot(e.x-player.x,e.y-player.y)<Math.hypot(best.x-player.x,best.y-player.y)?e:best,null);const a=target?Math.atan2(target.y-player.y,target.x-player.x):-Math.PI/2;shots.push({x:player.x,y:player.y-5,vx:Math.cos(a)*360,vy:Math.sin(a)*360,life:1});particle(player.x,player.y-7,'#ffb13b',2);}
function act(name){if(name==='attack'){attackHeld=true;fire();return;}if(cooldowns[name]>0||dead)return;
const use=(time,cost=0)=>{if(energy<cost){statusEl.textContent='LOW ENERGY';return false;}energy-=cost;cooldowns[name]=time;return true;};
if(name==='skill1'&&use(4,12)){for(let i=0;i<3;i++)shots.push({x:player.x,y:player.y,vx:(i-1)*105,vy:-340,life:1});particle(player.x,player.y,'#ff4a3d',10);statusEl.textContent='SKILL 1 · TRIPLE SHOT';}
if(name==='skill2'&&use(7,18)){health=Math.min(100,health+18);particle(player.x,player.y,'#ffb13b',14);statusEl.textContent='SKILL 2 · REPAIR';}
if(name==='skill3'&&use(5,16)){enemies.forEach(e=>{if(Math.hypot(e.x-player.x,e.y-player.y)<95){e.hp-=3;particle(e.x,e.y,'#42cfff',7);}});statusEl.textContent='SKILL 3 · PULSE';}
if(name==='vengeance'&&use(9,20)){shield=3.5;player.invuln=3.5;particle(player.x,player.y,'#249fff',20);statusEl.textContent='VENGEANCE · SHIELD';}
if(name==='battle'&&use(12,28)){enemies.forEach(e=>{e.hp-=5;particle(e.x,e.y,'#ffad35',10);});particle(player.x,player.y,'#ffad35',28);statusEl.textContent='BATTLE SPELL · BLAST';}
if(name==='recall'&&use(15)){player.x=w/2;player.y=h*.72;health=Math.min(100,health+12);particle(player.x,player.y,'#168de1',14);statusEl.textContent='RECALL · RETURNED';}
if(name==='regen'&&use(14,10)){health=Math.min(100,health+32);energy=Math.min(100,energy+10);particle(player.x,player.y,'#37df69',18);statusEl.textContent='REGEN · +HP';}
}
document.querySelectorAll('[data-action]').forEach(btn=>{const name=btn.dataset.action;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('pressed');if(name==='attack'){attackHeld=true;fire();}else act(name);});const release=()=>{btn.classList.remove('pressed');if(name==='attack')attackHeld=false;};btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',release);});
function updateMove(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);move.x=dx/len*k;move.y=dy/len*k;knob.style.left=(50+move.x*34)+'%';knob.style.top=(50+move.y*34)+'%';}
pad.addEventListener('pointerdown',e=>{e.preventDefault();movePointer=e.pointerId;pad.setPointerCapture(e.pointerId);updateMove(e);});
pad.addEventListener('pointermove',e=>{if(e.pointerId===movePointer)updateMove(e);});
function releaseMove(e){if(e.pointerId!==movePointer)return;movePointer=null;move.x=move.y=0;knob.style.left='50%';knob.style.top='50%';}
pad.addEventListener('pointerup',releaseMove);pad.addEventListener('pointercancel',releaseMove);
document.getElementById('restart').addEventListener('click',reset);
function update(dt){elapsed+=dt;spawnTimer-=dt;if(spawnTimer<=0&&!dead){spawn();spawnTimer=Math.max(.35,1.25-wave*.035);}if(attackHeld&&elapsed%0.18<dt)fire();
player.x=Math.max(8,Math.min(w-8,player.x+move.x*player.speed*dt));player.y=Math.max(22,Math.min(h-8,player.y+move.y*player.speed*dt));player.invuln=Math.max(0,player.invuln-dt);shield=Math.max(0,shield-dt);energy=Math.min(100,energy+dt*3);
Object.keys(cooldowns).forEach(k=>cooldowns[k]=Math.max(0,cooldowns[k]-dt));
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0||s.x<0||s.x>w||s.y<0||s.y>h){shots.splice(i,1);continue;}for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+3){e.hp--;particle(s.x,s.y,'#ffb13b',4);shots.splice(i,1);if(e.hp<=0){particle(e.x,e.y,e.boss?'#ff3e35':'#36d9ec',e.boss?24:9);score+=e.boss?100:10;while(score>=nextWaveScore){wave++;nextWaveScore+=100;statusEl.textContent='WAVE '+String(wave).padStart(2,'0')+' · ENGAGE';}enemies.splice(j,1);}break;}}}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];const dx=player.x-e.x,dy=player.y-e.y,len=Math.hypot(dx,dy)||1;e.x+=dx/len*e.speed*dt;e.y+=dy/len*e.speed*dt;e.fire-=dt;if(len<e.r+player.r+2&&player.invuln<=0){if(shield<=0)health-=e.boss?12:7;player.invuln=.65;particle(player.x,player.y,'#ff3939',8);}if(e.y>h+20||e.hp<=0)enemies.splice(i,1);}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
if(health<=0&&!dead){dead=true;health=0;statusEl.textContent='SYSTEM DOWN · PRESS RESET';particle(player.x,player.y,'#ff2929',30);}
hpbar.style.width=health+'%';energybar.style.width=energy+'%';scoreEl.textContent=String(score).padStart(4,'0');waveEl.textContent=String(wave).padStart(2,'0');
}
function draw(){ctx.fillStyle='#08111b';ctx.fillRect(0,0,w,h);const tile=26;ctx.strokeStyle='#16313c';ctx.lineWidth=.7;for(let x=0;x<w;x+=tile){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(let y=0;y<h;y+=tile){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
for(let i=0;i<9;i++){const x=(i*53+elapsed*9)%(w+60)-30,y=(i*79+25)%(h-20);ctx.fillStyle=i%2?'#162b34':'#2a332e';ctx.fillRect(x,y,24,18);ctx.strokeStyle='#8b6028';ctx.strokeRect(x,y,24,18);ctx.fillStyle='#1b9ca8';ctx.fillRect(x+3,y+3,4,2);}
enemies.forEach(e=>{ctx.fillStyle=e.boss?'#a51e2b':'#7a2632';ctx.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);ctx.fillStyle=e.boss?'#ff463e':'#ff9b3b';ctx.fillRect(e.x-3,e.y-3,6,6);ctx.fillStyle='#08090b';ctx.fillRect(e.x-e.r,e.y-e.r-6,e.r*2,3);ctx.fillStyle='#ff3939';ctx.fillRect(e.x-e.r,e.y-e.r-6,e.r*2*Math.max(0,e.hp/(e.boss?10:2)),3);});
shots.forEach(s=>{ctx.fillStyle='#ffc15c';ctx.fillRect(s.x-2,s.y-4,4,8);ctx.fillStyle='#ffeb9b';ctx.fillRect(s.x-1,s.y-6,2,4);});
particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);});ctx.globalAlpha=1;
ctx.strokeStyle=shield>0?'#2eb8ff':'#36e7ef';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,player.r+5+Math.sin(elapsed*8)*1.5,0,Math.PI*2);ctx.stroke();ctx.fillStyle=player.invuln>0?'#f5d7a0':'#2e9ef0';ctx.fillRect(player.x-5,player.y-7,10,14);ctx.fillStyle='#e9e2ce';ctx.fillRect(player.x-3,player.y-9,6,4);ctx.fillStyle='#ff3c32';ctx.fillRect(player.x-4,player.y+2,8,3);
if(dead){ctx.fillStyle='#020408c9';ctx.fillRect(0,0,w,h);ctx.fillStyle='#ff5148';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('SYSTEM DOWN',w/2,h/2);ctx.fillStyle='#f0d8b0';ctx.font='10px monospace';ctx.fillText('PRESS RESET',w/2,h/2+20);}
}
function frame(t){if(!last)last=t;const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame);}
reset();requestAnimationFrame(frame);
document.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>
</body>
</html>
